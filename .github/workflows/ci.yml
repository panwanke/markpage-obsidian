name: Validate Obsidian plugin
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: markpage-obsidian
          path: dist/
          retention-days: 14
