name: Package Obsidian release
on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify plugin tag
        run: node -e 'if (process.env.GITHUB_REF_NAME !== require("./manifest.json").version) throw new Error("Tag must equal plugin manifest version")'
      - run: npm run check
      - name: Create reviewable draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/main.js dist/manifest.json dist/styles.css dist/versions.json
          dist/build-info.json dist/SHA256SUMS.txt dist/markpage-*.zip
          --verify-tag --draft --title "MarkPage $GITHUB_REF_NAME"
          --notes-file RELEASE_NOTES.md
